<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Florida Fishing Guide — Legal</title>
<style>
  :root {
    --bg: #f4f7f9;
    --card: #ffffff;
    --ink: #16232c;
    --ink-soft: #4a5b66;
    --line: #dde5ea;
    --accent: #0f6e8c;
    --accent-soft: #e6f2f6;
    --warn-bg: #fff8e1;
    --warn-line: #e6c34a;
    --warn-ink: #6b4e00;
    --radius: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101820;
      --card: #17222b;
      --ink: #e8eef2;
      --ink-soft: #a9b8c2;
      --line: #27363f;
      --accent: #5cc4e0;
      --accent-soft: #16333d;
      --warn-bg: #2e2713;
      --warn-line: #7a6520;
      --warn-ink: #f0dda0;
    }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    padding: 2rem 1rem 4rem;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.65;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .wrap {
    max-width: 46rem;
    margin: 0 auto;
  }

  header.page-head {
    margin-bottom: 1.5rem;
  }

  h1 {
    font-size: 1.75rem;
    line-height: 1.25;
    margin: 0 0 .35rem;
    letter-spacing: -0.01em;
  }

  .updated {
    color: var(--ink-soft);
    font-size: .9rem;
    margin: 0;
  }

  @media (max-width: 480px) {
    .card { padding: 1.2rem 1.15rem; }
  }

  h2 {
    font-size: 1.15rem;
    margin: 0 0 .75rem;
    color: var(--accent);
    letter-spacing: -0.005em;
  }

  h2 + p, h2 + ul { margin-top: 0; }

  p { margin: 0 0 .9rem; }
  p:last-child, ul:last-child { margin-bottom: 0; }

  ul {
    margin: 0 0 .9rem;
    padding-left: 1.25rem;
  }

  li { margin-bottom: .4rem; }
  li:last-child { margin-bottom: 0; }

  strong { font-weight: 600; }

  a {
    color: var(--accent);
    text-decoration-thickness: 1px;
    text-underline-offset: 2px;
  }

  .placeholder {
    background: var(--accent-soft);
    border-radius: 4px;
    padding: 0 .25em;
    font-weight: 600;
  }

  footer {
    text-align: center;
    color: var(--ink-soft);
    font-size: .85rem;
    margin-top: 2rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="page-head">
      <h1>Florida Fishing Guide</h1>
    </header>
    <ul>
      <li><a href="privacy.html">Privacy Policy</a></li>
      <li><a href="terms.html">Terms of Use</a></li>
    </ul>
  </div>
    <footer>
    <p>&copy; <span class="current-year-value">2026</span> <span class="placeholder">DuxByte</span>. All rights reserved.</p>
  </footer>
</body>
<script>
  document.querySelector('.current-year-value').innerHTML = new Date().getFullYear();
</script>
</html>
